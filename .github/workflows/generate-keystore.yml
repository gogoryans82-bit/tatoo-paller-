name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate a keystore and base64-encode it
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Breezy Ink, OU=Mobile, O=Breezy Ink and Iron, L=Nairobi, ST=Nairobi, C=KE"

      - name: Base64 encode the keystore
        run: base64 -w 0 release.keystore > keystore-base64.txt

      - name: Upload raw keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 7

      - name: Upload base64 keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-base64.txt
          retention-days: 7
