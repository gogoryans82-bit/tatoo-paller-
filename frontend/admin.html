<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Ink & Iron</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-section { margin-bottom: 3rem; }
    .admin-section h3 { margin-bottom: 1rem; color: #c9a227; }
    .upload-form { display: flex; flex-direction: column; gap: 0.5rem; max-width: 500px; }
    .upload-form input, .upload-form textarea {
      background: #1a1a1a; border: 1px solid #333; color: #e8e8e8;
      padding: 0.6rem; border-radius: 4px; font-family: inherit;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid #222; font-size: 0.9rem; }
    th { color: #c9a227; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 3px; font-size: 0.8rem; }
    .badge-pending { background: #444; }
    .badge-confirmed { background: #1a7a3a; }
    .badge-completed { background: #1a5a7a; }
    .badge-cancelled { background: #7a1a1a; }
    .del-btn { background: #7a1a1a; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 3px; cursor: pointer; font-size: 0.8rem; }
    .gallery-admin img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <span class="logo">Admin Panel</span>
      <nav><a href="/">View Site</a></nav>
    </div>
  </header>

  <div class="container section">
    <div class="admin-section">
      <h3>Upload Photo</h3>
      <form id="upload-form" class="upload-form">
        <input type="text" name="title" placeholder="Title" required>
        <textarea name="description" placeholder="Description (optional)" rows="2"></textarea>
        <input type="file" name="photo" accept="image/*" required>
        <button type="submit" class="btn">Upload</button>
      </form>
      <p id="upload-status" class="status"></p>
    </div>

    <div class="admin-section">
      <h3>Manage Photos</h3>
      <div id="admin-gallery" class="gallery-admin"></div>
    </div>

    <div class="admin-section">
      <h3>Bookings</h3>
      <div id="bookings-list"></div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
